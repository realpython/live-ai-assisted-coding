[project]
name = "live-session-project"  # Renamed live once the project is picked
version = "0.1.0"
description = "Built live in a Real Python Live session on AI-assisted coding"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # flake8-bugbear: likely bugs
    "UP",   # pyupgrade: modern syntax
    "SIM",  # flake8-simplify
]
