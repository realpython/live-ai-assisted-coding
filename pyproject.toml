[project]
name = "botbattle"
version = "0.1.0"
description = "Bots fight on a grid in the terminal until one is left standing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
botbattle = "botbattle.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # flake8-bugbear: likely bugs
    "UP",   # pyupgrade: modern syntax
    "SIM",  # flake8-simplify
]
