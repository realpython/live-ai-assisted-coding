# Runs the checks on every pull request (including submitted bots) and on
# every push to main.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # A bot that loops forever would hang the match, so fail fast instead.
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0  # setup-uv only publishes full version tags

      - name: Install Python and dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Play a match with every bot
        run: uv run botbattle --no-animate --seed 0
